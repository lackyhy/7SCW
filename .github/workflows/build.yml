name: Build and Release 7SCW

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build with MinGW (C++20)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW in PATH
        shell: pwsh
        run: |
          # В Windows Runner уже предустановлен WinLibs / MinGW в C:\ProgramData\mingw64\mingw64\bin
          if (Test-Path "C:\ProgramData\mingw64\mingw64\bin") {
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            # Fallback: шоколадка без сломанных сторонних actions
            choco install mingw --version 13.2.0 -y --no-progress
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify GCC Version
        shell: pwsh
        run: |
          g++ --version
          cmake --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j 4

      - name: Verify Executable
        shell: pwsh
        run: |
          if (Test-Path "build/7SCW.exe") {
            Write-Host "Build succeeded: build/7SCW.exe found"
            Get-Item "build/7SCW.exe" | Format-List Length, LastWriteTime
          } else {
            Write-Error "7SCW.exe not found in build directory!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7SCW-windows-x64
          path: build/7SCW.exe
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/7SCW.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
