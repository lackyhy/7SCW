name: Build and Release 7SCW (Windows 11 / x64)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'release*'
      - '*.*.*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 7SCW for Windows 11 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 (GCC C++20)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Add MinGW64 to PATH
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Environment
        shell: pwsh
        run: |
          g++ --version
          cmake --version
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Verify Executable
        shell: pwsh
        run: |
          if (Test-Path "build/7SCW.exe") {
            $item = Get-Item "build/7SCW.exe"
            Write-Host "Build succeeded: build/7SCW.exe ($([math]::Round($item.Length / 1MB, 2)) MB)"
            $item | Format-List Length, LastWriteTime
          } else {
            Write-Error "7SCW.exe not found in build directory!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7SCW-win11-x64
          path: build/7SCW.exe
          if-no-files-found: error

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/7SCW.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
